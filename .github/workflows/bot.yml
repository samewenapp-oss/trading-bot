name: trading-bot

on:
  schedule:
    # Weekdays 19:07 UTC = 2:07pm New York in winter, 3:07pm in summer.
    # Mid-afternoon: tight spreads, calm prices, close to the backtest's "trade at the close".
    # GitHub sometimes starts scheduled runs late, so this leaves ~1 hour of buffer before the 4pm close.
    # (Odd minute on purpose: runs scheduled on the hour get delayed more.)
    - cron: "7 19 * * 1-5"
  workflow_dispatch:   # "Run workflow" button, works from the GitHub phone app
    inputs:
      mode:
        description: "execute = paper orders, dry-run = just show what it would do"
        type: choice
        options: [execute, dry-run]
        default: dry-run

permissions:
  contents: write   # to save state/ and the trade log back to the repo

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "dry-run" ]; then
            python main.py live --force
          else
            python main.py live --execute
          fi
      - name: Save state and trade log
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -f state/state.json logs/trades.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot: update state $(date -u +%F)" && git push)
