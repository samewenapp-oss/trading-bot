# Monthly trend rotation. Change rules here, then re-run the backtest BEFORE trading them.

[universe]
# Liquid, diversified ETFs: US stocks, intl stocks, bonds, gold, commodities, real estate.
symbols = ["SPY", "QQQ", "IWM", "EFA", "EEM", "TLT", "IEF", "GLD", "DBC", "VNQ"]
cash_symbol = "BIL"   # T-bill ETF that holds whatever isn't invested in the above

[strategy]
trend_sma = 200          # an ETF only qualifies if its close is above its 200-day average
momentum_lookback = 126  # rank ETFs by ~6-month return
vol_lookback = 60        # size by 60-day volatility (calmer assets get more money)
top_n = 5                # hold up to the 5 strongest ETFs that are in uptrends

[risk]
cash_buffer_pct = 0.02     # keep 2% as plain cash for rounding and fees
min_trade_pct = 0.01       # skip rebalance trades smaller than 1% of equity (cuts churn)
max_daily_loss_pct = 0.03  # if the account is down 3%+ today, sells still run but buys wait

[costs]
slippage_bps = 5.0    # 0.05% per trade. The backtest still holds up at 20.
commission_bps = 0.0

[backtest]
start = "2008-01-01"
initial_equity = 10000
out_of_sample_frac = 0.3   # report the last 30% of the period separately
execution_delay_days = 1   # signal at month-end close, trade at the NEXT day's close (conservative)

[live]
state_file = "state/state.json"
log_dir = "logs"
kill_switch_file = "STOP"      # create a file named STOP in this folder to halt the bot
allow_live_trading = false     # must be true AND a non-paper URL set to trade real money
max_bar_age_days = 5           # skip a symbol if its latest daily bar is older than this
fractional = true              # fractional shares (needed for small accounts)
